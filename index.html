<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calendário da escala dos times Amarelo, Azul e Verde">
  <meta name="theme-color" content="#6d573d">
  <title>Calendário Escala · Times</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6d573d">
</head>
<body>
  <div class="card" id="app">
    <div class="cabecalho">
      <div class="titulo-area">
        <h1>📅 Escala</h1>
        <div class="nav-meses">
          <button id="btnMesAnterior" aria-label="Mês anterior">◀</button>
          <span id="mesAnoLabel">Carregando...</span>
          <button id="btnMesSeguinte" aria-label="Próximo mês">▶</button>
        </div>
      </div>
      <div class="legenda">
        <span><i class="cor-amarelo"></i> Amarelo</span>
        <span><i class="cor-azul"></i> Azul</span>
        <span><i class="cor-verde"></i> Verde</span>
        <span><i class="cor-folga"></i> Folga</span>
      </div>
    </div>

    <div class="calendario-scroll">
      <div class="grid-calendario" id="calendarioGrid">
          <div class="dia-semana">Dom</div>
          <div class="dia-semana">Seg</div>
          <div class="dia-semana">Ter</div>
          <div class="dia-semana">Qua</div>
          <div class="dia-semana">Qui</div>
          <div class="dia-semana">Sex</div>
          <div class="dia-semana">Sáb</div>
      </div>
    </div>

    <div class="footer-info">

  <div class="footer-status">
    <span><strong>Hoje:</strong> <span id="hojeInfo">Carregando...</span></span>
    <span class="atual" id="statusHoje">Calculando escala...</span>
  </div>

  <div class="footer-creditos">
    <p>
      Desenvolvido por
      <a href="https://hisaba-dev.com"
         target="_blank"
         rel="noopener noreferrer">
         Carlos Hisaba
      </a>.
    </p>
    <p>© 2026 Todos os direitos reservados.</p>
  </div>

</div>

  <script src="script.js"></script>
</body>
</html>
